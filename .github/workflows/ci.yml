name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apr
          POSTGRES_PASSWORD: apr
          POSTGRES_DB: apr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apr" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end on real PostgreSQL
        run: pnpm vitest run apps/server/test/e2e.test.ts
        env:
          TEST_DATABASE_URL: postgres://apr:apr@localhost:5432/apr
      - run: pnpm build
